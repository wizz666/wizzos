<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>WizzOS</title>
  <link rel="icon" href="/static/favicon.png" type="image/png">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <meta name="theme-color" content="#0d0f1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="WizzOS">
  <link rel="apple-touch-icon" href="/static/logo-192.png">
  <link rel="stylesheet" href="/static/style.css?v=2.0.0">
</head>
<body>
  <div id="bg" aria-hidden="true"><i></i><i></i><i></i></div>

  <!-- Inloggning / första start -->
  <section id="auth" class="auth hidden">
    <form class="auth-card" id="auth-form">
      <img src="/static/logo-192.png" alt="" class="auth-logo">
      <h1>WizzOS</h1>
      <p class="auth-tag">Din egen server. Enkelt.</p>
      <p id="auth-text">Logga in för att fortsätta.</p>
      <input type="password" id="auth-pw" placeholder="Lösenord" autocomplete="current-password" required>
      <input type="password" id="auth-pw2" placeholder="Skriv lösenordet igen" class="hidden" autocomplete="new-password">
      <button class="btn primary big" type="submit" id="auth-btn">Logga in</button>
      <p class="error" id="auth-err"></p>
      <ul class="auth-perks" id="auth-perks"><li>📦 Hundratals appar med ett klick</li><li>↶ Ångra-knapp på allt</li><li>🛡️ Backup som testas varje natt</li><li>✨ Hjälp på svenska</li></ul>
    </form>
  </section>

  <!-- Själva appen -->
  <div id="shell" class="shell hidden">
    <nav class="side">
      <a class="brand" href="#/"><img src="/static/logo-192.png" alt=""><span>WizzOS</span></a>
      <button class="side-search" id="side-search" type="button"><svg><use href="#i-search"/></svg><span>Sök</span><kbd>Ctrl K</kbd></button>
      <a href="#/" data-nav="home"><svg><use href="#i-home"/></svg><span>Hem</span></a>
      <a href="#/store" data-nav="store"><svg><use href="#i-store"/></svg><span>Appbutik</span></a>
      <a href="#/files" data-nav="files"><svg><use href="#i-folder"/></svg><span>Filer</span></a>
      <a href="#/backup" data-nav="backup"><svg><use href="#i-shield"/></svg><span>Backup</span></a>
      <a href="#/trygghet" data-nav="trygghet"><svg><use href="#i-heart"/></svg><span>Trygghet</span></a>
      <a href="#/settings" data-nav="settings"><svg><use href="#i-gear"/></svg><span>Inställningar</span></a>
      <div class="side-foot" style="margin-top:auto"><span id="ver"></span></div>
    </nav>
    <main id="view"></main>
  </div>

  <!-- Dialogruta -->
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card"><button class="icon-btn modal-x" data-close aria-label="Stäng"><svg><use href="#i-x"/></svg></button><div id="modal-body"></div></div>
  </div>
  <div id="toasts"></div>

  <!-- AI-hjälp -->
  <button id="ai-fab" class="ai-fab hidden" aria-label="Fråga AI-assistenten">✨ <span>Fråga</span></button>
  <aside id="ai-panel" class="ai-panel hidden" aria-label="AI-assistent">
    <header><b>✨ Assistenten</b><span id="ai-model" class="hint"></span>
      <button class="icon-btn" id="ai-new" title="Ny konversation" aria-label="Ny konversation"><svg><use href="#i-refresh"/></svg></button>
      <button class="icon-btn" id="ai-close" aria-label="Stäng"><svg><use href="#i-x"/></svg></button></header>
    <div id="ai-msgs" class="ai-msgs"></div>
    <form id="ai-form" class="ai-form"><textarea id="ai-input" rows="1" placeholder="Fråga om din server …"></textarea>
      <button class="btn primary" id="ai-send" type="submit" aria-label="Skicka">➤</button></form>
  </aside>

  <svg width="0" height="0" style="position:absolute">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
    <symbol id="i-store" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><path d="M17.25 13.5v7.5M13.5 17.25H21" stroke-linecap="round"/></g></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7" stroke-linecap="round"/></g></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-dots" viewBox="0 0 24 24"><g fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></g></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5" stroke-linecap="round"/></g></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-open" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3 4.5 6v5.5c0 4.6 3.1 8.4 7.5 9.5 4.4-1.1 7.5-4.9 7.5-9.5V6z M8.8 12.2l2.2 2.2 4.3-4.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.4-7.5-10.2A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.7c0 5.8-7.5 10.2-7.5 10.2z M9 12.3h1.8l1-2 1.6 4 1-2H17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h4.6l2 2.2h8.4A1.5 1.5 0 0 1 21 8.7v9.8a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
    <symbol id="i-box" viewBox="0 0 24 24"><path d="M12 3 3 7.5v9L12 21l9-4.5v-9zM3 7.5 12 12l9-4.5M12 12v9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
  </svg>
  <script src="/static/app.js?v=2.0.0"></script>
  <script src="/static/trygghet.js?v=2.0.0"></script>
  <script src="/static/ailink.js?v=2.0.0"></script>
  <script src="/static/search.js?v=2.0.0"></script>
  <script src="/static/goals.js?v=2.0.0"></script>
  <script src="/static/welcome.js?v=2.0.0"></script>
</body>
</html>
